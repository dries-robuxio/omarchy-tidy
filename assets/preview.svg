<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#101118"/>

  <!-- logo + name -->
  <g transform="translate(120 110)">
    <rect width="112" height="112" rx="26" fill="#1c1d27"/>
    <path d="M24 56 q 8 -14 16 0 t 16 0 L 88 56" transform="translate(0 0)"
          fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="74" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="56" font-weight="700" fill="#ffffff">Tidy</text>
  </g>
  <text x="1480" y="182" text-anchor="end" font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace" font-size="30" fill="#8a8fa6">fix what you typed, in any app, with one key</text>

  <!-- before -->
  <g font-family="JetBrainsMono Nerd Font, JetBrains Mono, monospace">
    <rect x="120" y="290" width="1360" height="160" rx="18" fill="#191a23" stroke="#2a2c3a"/>
    <text x="160" y="345" font-size="26" fill="#6b7086">before</text>
    <text x="160" y="405" font-size="33" fill="#c9cbd6">teh meeting is tomorow, can you send me the the docs bfeore 3?</text>

    <!-- key -->
    <g transform="translate(800 505)">
      <rect x="-210" y="-34" width="420" height="68" rx="14" fill="#1c1d27" stroke="#3a3d52"/>
      <text x="0" y="12" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Super + Ctrl + Y</text>
    </g>

    <!-- after -->
    <rect x="120" y="580" width="1360" height="160" rx="18" fill="#191a23" stroke="#7ee0c3" stroke-opacity="0.55"/>
    <text x="160" y="635" font-size="26" fill="#7ee0c3">after, ~1 second</text>
    <text x="160" y="695" font-size="33" fill="#ffffff">The meeting is tomorrow, can you send me the docs before 3?</text>

    <text x="800" y="830" text-anchor="middle" font-size="28" fill="#6b7086">Claude Code · Codex · OpenCode · Gemini CLI · Ollama · any OpenAI-compatible API</text>
  </g>
</svg>
